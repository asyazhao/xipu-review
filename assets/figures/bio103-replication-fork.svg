<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="复制叉上的前导链与后随链">
<title>复制叉上的前导链与后随链</title>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4A6B"/></marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5E58"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C4F45"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F735F"/></marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8894F"/></marker>
</defs>
<text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#262624" text-anchor="start" font-weight="600">复制叉上的前导链与后随链</text>
<text x="400" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="middle" font-weight="400">复制叉移动方向 →</text>
<path d="M 60 175 L 400 175 L 740 110" fill="none" stroke="#8A8F98" stroke-width="2.2"/>
<path d="M 60 225 L 400 225 L 740 290" fill="none" stroke="#8A8F98" stroke-width="2.2"/>
<text x="80" y="163" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">亲代链</text>
<text x="80" y="247" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">亲代链</text>
<circle cx="400" cy="200" r="10" fill="#F5F1E7" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="400" y="238" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#2E4A6B" text-anchor="middle" font-weight="600">解旋酶</text>
<path d="M 400 185 L 735 120" fill="none" stroke="#2E4A6B" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
<text x="600" y="102" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#2E4A6B" text-anchor="middle" font-weight="600">前导链（连续 5′→3′）</text>
<line x1="710" y1="270" x2="640" y2="252" stroke="#A8894F" stroke-width="3.2" marker-end="url(#arrowGold)"/>
<line x1="610" y1="244" x2="540" y2="227" stroke="#A8894F" stroke-width="3.2" marker-end="url(#arrowGold)"/>
<line x1="510" y1="220" x2="440" y2="203" stroke="#A8894F" stroke-width="3.2" marker-end="url(#arrowGold)"/>
<text x="585" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#A8894F" text-anchor="middle" font-weight="600">后随链（Okazaki 片段，不连续）</text>
<text x="60" y="320" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">两条新链的化学合成方向都是 5′→3′；后随链只是相对复制叉“倒退着”分段合成。</text>
</svg>
