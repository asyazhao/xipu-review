<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="减数分裂 I 与 II 的流程">
<title>减数分裂 I 与 II 的流程</title>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4A6B"/></marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5E58"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C4F45"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F735F"/></marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8894F"/></marker>
</defs>
<text x="40" y="32" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#262624" text-anchor="start" font-weight="600">减数分裂 I 与 II 的流程</text>
<rect x="40" y="80" width="158" height="92" rx="3" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="119.0" y="112.33333333333333" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">间期</text>
<text x="119.0" y="130.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">DNA 复制一次</text>
<text x="119.0" y="148.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">形成姐妹染色单体</text>
<line x1="202" y1="126.0" x2="232" y2="126.0" stroke="#2E4A6B" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<rect x="238" y="80" width="158" height="92" rx="3" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="317.0" y="103.33333333333333" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">减数分裂 I</text>
<text x="317.0" y="121.33333333333333" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">前期 I → 中期 I</text>
<text x="317.0" y="139.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">后期 I → 末期 I</text>
<text x="317.0" y="157.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">同源染色体分离</text>
<line x1="400" y1="126.0" x2="430" y2="126.0" stroke="#2E4A6B" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<rect x="436" y="80" width="158" height="92" rx="3" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="515.0" y="103.33333333333333" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">减数分裂 II</text>
<text x="515.0" y="121.33333333333333" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">前期 II → 中期 II</text>
<text x="515.0" y="139.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">后期 II → 末期 II</text>
<text x="515.0" y="157.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">姐妹染色单体分离</text>
<line x1="598" y1="126.0" x2="628" y2="126.0" stroke="#2E4A6B" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<rect x="634" y="80" width="126" height="92" rx="3" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="697.0" y="112.33333333333333" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">4 个单倍体</text>
<text x="697.0" y="130.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">配子</text>
<text x="697.0" y="148.33333333333331" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="middle" font-weight="500">染色体数为 n</text>
<text x="120" y="205" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="middle" font-weight="400">2n</text>
<text x="317" y="205" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="middle" font-weight="400">2n → n</text>
<text x="515" y="205" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="middle" font-weight="400">n → n</text>
<text x="697" y="205" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="middle" font-weight="400">n</text>
<text x="40" y="270" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#2E4A6B" text-anchor="start" font-weight="400">关键：DNA 只复制一次，细胞连续分裂两次。</text>
<text x="40" y="296" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#5E5E58" text-anchor="start" font-weight="400">同源染色体在减数分裂 I 分离；姐妹染色单体在减数分裂 II 分离。</text>
<text x="40" y="322" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#5E5E58" text-anchor="start" font-weight="400">因此每个配子只含每对同源染色体中的一条。</text>
</svg>
