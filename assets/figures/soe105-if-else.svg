<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" role="img" aria-label="if-else 的控制流">
<title>if-else 的控制流</title>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4A6B"/></marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5E58"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C4F45"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F735F"/></marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8894F"/></marker>
</defs>
<text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#262624" text-anchor="start" font-weight="600">if-else 的控制流</text>
<polygon points="330,90 470,90 520,150 470,210 330,210 280,150" fill="#E7EBF1" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="400" y="146" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#2E4A6B" text-anchor="middle" font-weight="700">条件？</text>
<text x="400" y="168" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5E5E58" text-anchor="middle" font-weight="400">score ≥ 60</text>
<rect x="110" y="270" width="170" height="58" rx="4" fill="#FFFFFF" stroke="#5F735F" stroke-width="1.4"/>
<text x="195" y="304" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5F735F" text-anchor="middle" font-weight="700">执行 if 分支</text>
<rect x="520" y="270" width="170" height="58" rx="4" fill="#FFFFFF" stroke="#8C4F45" stroke-width="1.4"/>
<text x="605" y="304" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8C4F45" text-anchor="middle" font-weight="700">执行 else 分支</text>
<line x1="350" y1="210" x2="240" y2="266" stroke="#262624" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
<line x1="450" y1="210" x2="560" y2="266" stroke="#262624" stroke-width="1.4" marker-end="url(#arrowRed)"/>
<text x="268" y="246" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5F735F" text-anchor="start" font-weight="400">真</text>
<text x="526" y="246" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#8C4F45" text-anchor="start" font-weight="400">假</text>
<text x="40" y="360" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">条件只判断一次；两个分支互斥，最多执行一个。</text>
</svg>
