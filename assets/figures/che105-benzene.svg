<ellipse cx="138.2827229118074" cy="125.49999999999999" rx="10" ry="22" fill="#E7EBF1" stroke="#A8894F" stroke-width="1.1" transform="rotate(210 138.2827229118074 125.49999999999999)"/>
<text x="250" y="70" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#A8894F" text-anchor="middle" font-weight="600">p 轨道侧向重叠</text>
<text x="470" y="110" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#2E4A6B" text-anchor="start" font-weight="600">平面、环状、完全共轭</text>
<text x="470" y="140" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#262624" text-anchor="start" font-weight="600">4n + 2 = 6，n = 1</text>
<text x="470" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">六个 p 轨道 → 三个成键 MO</text>
<text x="470" y="194" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">电子占据成键轨道，能量降低</text>
<text x="470" y="230" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#2E4A6B" text-anchor="start" font-weight="600">芳香性判据：</text>
<text x="470" y="252" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">环状、平面、完全共轭、4n+2</text>
<text x="40" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">苯的 π 电子不固定在三个双键上，而是在整个环上离域；圆圈是离域的简写。</text>
</svg>
