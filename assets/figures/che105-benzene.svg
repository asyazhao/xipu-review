<circle cx="167.72758664047834" cy="142.5" r="4" fill="#2E4A6B" stroke="none" stroke-width="1.5"/>
<text x="250" y="195" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#2E4A6B" text-anchor="middle" font-weight="700">6 π e−</text>
<text x="250" y="220" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5E5E58" text-anchor="middle" font-weight="400">离域</text>
<ellipse cx="250.0" cy="61.0" rx="10" ry="22" fill="#E7EBF1" stroke="#A8894F" stroke-width="1.1" transform="rotate(-90 250.0 61.0)"/>
<ellipse cx="361.7172770881926" cy="125.50000000000001" rx="10" ry="22" fill="#E7EBF1" stroke="#A8894F" stroke-width="1.1" transform="rotate(-30 361.7172770881926 125.50000000000001)"/>
<ellipse cx="361.7172770881926" cy="254.5" rx="10" ry="22" fill="#E7EBF1" stroke="#A8894F" stroke-width="1.1" transform="rotate(30 361.7172770881926 254.5)"/>
<ellipse cx="250.0" cy="319.0" rx="10" ry="22" fill="#E7EBF1" stroke="#A8894F" stroke-width="1.1" transform="rotate(90 250.0 319.0)"/>
