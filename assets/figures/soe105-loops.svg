<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" role="img" aria-label="while 与 do-while 的控制流">
<title>while 与 do-while 的控制流</title>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4A6B"/></marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5E58"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C4F45"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F735F"/></marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8894F"/></marker>
</defs>
<text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#262624" text-anchor="start" font-weight="600">while 与 do-while 的控制流</text>
<text x="70" y="62" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#2E4A6B" text-anchor="start" font-weight="600">while：先判断，后执行</text>
<polygon points="160,90 250,90 290,135 250,180 160,180 120,135" fill="#E7EBF1" stroke="#2E4A6B" stroke-width="1.4"/>
<text x="205" y="131" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2E4A6B" text-anchor="middle" font-weight="700">条件？</text>
<rect x="140" y="240" width="130" height="56" rx="4" fill="#FFFFFF" stroke="#5F735F" stroke-width="1.3"/>
<text x="205" y="272" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5F735F" text-anchor="middle" font-weight="700">循环体</text>
<line x1="205" y1="180" x2="205" y2="236" stroke="#5F735F" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
<path d="M 140 268 C 80 268, 80 135, 116 135" fill="none" stroke="#5E5E58" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
<text x="70" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5E5E58" text-anchor="start" font-weight="400">可能一次都不执行。</text>
<text x="480" y="62" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#A8894F" text-anchor="start" font-weight="600">do-while：先执行，后判断</text>
<rect x="470" y="90" width="130" height="56" rx="4" fill="#FFFFFF" stroke="#A8894F" stroke-width="1.3"/>
<text x="535" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#A8894F" text-anchor="middle" font-weight="700">循环体</text>
<polygon points="500,200 570,200 610,245 570,290 500,290 460,245" fill="#E7EBF1" stroke="#A8894F" stroke-width="1.4"/>
<text x="535" y="241" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#A8894F" text-anchor="middle" font-weight="700">条件？</text>
<line x1="535" y1="146" x2="535" y2="196" stroke="#A8894F" stroke-width="1.3" marker-end="url(#arrowGold)"/>
<path d="M 460 245 C 420 245, 420 118, 466 118" fill="none" stroke="#5E5E58" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
<text x="480" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5E5E58" text-anchor="start" font-weight="400">至少执行一次。</text>
<text x="40" y="360" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">while 与 do-while 的差别只在第一次判断的位置；循环变量必须在判断前初始化。</text>
</svg>
