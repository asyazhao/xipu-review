<text x="40" y="350" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">分泌方向：ER → Golgi → 分泌囊泡 → 质膜；胞吞方向相反。</text>
