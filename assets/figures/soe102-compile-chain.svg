<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 305" role="img" aria-label="从源码到运行的编译链路">
<title>从源码到运行的编译链路</title>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E4A6B"/></marker>
  <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5E58"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C4F45"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F735F"/></marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8894F"/></marker>
</defs>
<text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#262624" text-anchor="start" font-weight="600">从源码到运行的编译链路</text>
<rect x="60" y="140" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="125" y="168" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#2E4A6B" text-anchor="middle" font-weight="700">源文件</text>
<text x="125" y="190" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5E5E58" text-anchor="middle" font-weight="400">.java</text>
<rect x="240" y="140" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="305" y="168" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#2E4A6B" text-anchor="middle" font-weight="700">javac</text>
<text x="305" y="190" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5E5E58" text-anchor="middle" font-weight="400">编译器</text>
<rect x="420" y="140" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="485" y="168" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#2E4A6B" text-anchor="middle" font-weight="700">字节码</text>
<text x="485" y="190" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5E5E58" text-anchor="middle" font-weight="400">.class</text>
<rect x="600" y="140" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="665" y="168" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#2E4A6B" text-anchor="middle" font-weight="700">JVM</text>
<text x="665" y="190" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5E5E58" text-anchor="middle" font-weight="400">类加载 / 执行</text>
<line x1="194" y1="173" x2="234" y2="173" stroke="#2E4A6B" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<line x1="374" y1="173" x2="414" y2="173" stroke="#2E4A6B" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<line x1="554" y1="173" x2="594" y2="173" stroke="#2E4A6B" stroke-width="1.7" marker-end="url(#arrowBlue)"/>
<text x="150" y="118" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5E5E58" text-anchor="middle" font-weight="400">编译期</text>
<text x="670" y="118" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5E5E58" text-anchor="middle" font-weight="400">运行期</text>
<text x="40" y="260" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">javac 把源代码编译为与平台无关的字节码；JVM 在目标机器上加载并执行字节码。</text>
<text x="40" y="284" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">“一次编写，到处运行”依赖的是字节码与 JVM，而不是源代码本身。</text>
</svg>
