<text x="350" y="248" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2E4A6B" text-anchor="middle" font-weight="600">溴鎓离子</text>
<text x="350" y="266" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#5E5E58" text-anchor="middle" font-weight="400">bromonium ion</text>
<line x1="410" y1="170" x2="470" y2="170" stroke="#A8894F" stroke-width="1.6" marker-end="url(#arrowGold)"/>
<text x="440" y="154" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#A8894F" text-anchor="middle" font-weight="600">Br−</text>
<text x="545" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#262624" text-anchor="middle" font-weight="700">C</text>
<text x="625" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#262624" text-anchor="middle" font-weight="700">C</text>
<line x1="557" y1="170" x2="613" y2="170" stroke="#262624" stroke-width="2"/>
<text x="545" y="220" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#2E4A6B" text-anchor="middle" font-weight="600">Br</text>
<line x1="545" y1="184" x2="545" y2="208" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="625" y="120" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#2E4A6B" text-anchor="middle" font-weight="600">Br</text>
<line x1="625" y1="156" x2="625" y2="132" stroke="#2E4A6B" stroke-width="1.5"/>
<text x="585" y="260" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2E4A6B" text-anchor="middle" font-weight="600">反式加成产物</text>
<text x="585" y="278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#5E5E58" text-anchor="middle" font-weight="400">anti addition</text>
<text x="40" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">溴鎓离子阻止 Br− 从同侧进攻，因此两个 Br 加在双键的两侧。</text>
</svg>
