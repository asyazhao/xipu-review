<text x="329" y="210" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#2E4A6B" text-anchor="middle" font-weight="700">II</text>
<rect x="450" y="170" width="58" height="92" rx="5" fill="#FFFFFF" stroke="#2E4A6B" stroke-width="1.5"/>
