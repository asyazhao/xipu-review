<text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#262624" text-anchor="start" font-weight="600">溴对烯烃的两步亲电加成</text>
<text x="40" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5E5E58" text-anchor="start" font-weight="400">第一步：π 电子进攻 Br2，形成三元环溴鎓离子；第二步：Br− 从背面开环。</text>
<text x="90" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#262624" text-anchor="middle" font-weight="700">C</text>
<text x="170" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#262624" text-anchor="middle" font-weight="700">C</text>
<line x1="102" y1="170" x2="158" y2="170" stroke="#262624" stroke-width="2"/>
<line x1="90" y1="160" x2="90" y2="180" stroke="#262624" stroke-width="1.5"/>
<line x1="170" y1="160" x2="170" y2="180" stroke="#262624" stroke-width="1.5"/>
