<text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" fill="#262624" text-anchor="start" font-weight="600">苯的 π 体系与离域</text>
<polygon points="250.0,95.0 332.2724133595217,142.5 332.2724133595217,237.5 250.0,285.0 167.7275866404783,237.5 167.72758664047834,142.5" fill="#F5F1E7" stroke="#2E4A6B" stroke-width="1.8"/>
